<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="620" fill="#FFFFFF"/>
  <text x="440" y="34" font-size="22" font-weight="700" text-anchor="middle" fill="#0F172A">Option A — three central "help desks"</text>

  <!-- Screen -->
  <rect x="345" y="52" width="190" height="16" rx="4" fill="#E2E8F0" stroke="#94A3B8"/>
  <text x="440" y="64" font-size="11" text-anchor="middle" fill="#475569">Screen / AV</text>

  <!-- Desks -->
  <rect x="60"  y="86" width="220" height="80" rx="10" fill="#DCEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="170" y="114" font-size="14" font-weight="700" text-anchor="middle" fill="#1E3A8A">DESK 1</text>
  <text x="170" y="134" font-size="12" text-anchor="middle" fill="#1E3A8A">Product &amp; Business</text>
  <circle cx="145" cy="152" r="8" fill="#2563EB"/><circle cx="195" cy="152" r="8" fill="#2563EB"/>

  <rect x="330" y="86" width="220" height="80" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="440" y="114" font-size="14" font-weight="700" text-anchor="middle" fill="#14532D">DESK 2</text>
  <text x="440" y="134" font-size="12" text-anchor="middle" fill="#14532D">Engineering &amp; Ops</text>
  <circle cx="415" cy="152" r="8" fill="#16A34A"/><circle cx="465" cy="152" r="8" fill="#16A34A"/>

  <rect x="600" y="86" width="220" height="80" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="710" y="114" font-size="14" font-weight="700" text-anchor="middle" fill="#7C2D12">DESK 3</text>
  <text x="710" y="134" font-size="12" text-anchor="middle" fill="#7C2D12">Risk &amp; Compliance</text>
  <circle cx="685" cy="152" r="8" fill="#D97706"/><circle cx="735" cy="152" r="8" fill="#D97706"/>

  <!-- Team tables row 1 -->
  <g>
    <rect x="70"  y="250" width="120" height="78" rx="12" fill="#F1F5F9" stroke="#64748B"/>
    <text x="130" y="285" font-size="13" font-weight="600" text-anchor="middle" fill="#334155">Team 1</text>
    <text x="130" y="305" font-size="10" text-anchor="middle" fill="#64748B">building</text>
    <rect x="270" y="250" width="120" height="78" rx="12" fill="#F1F5F9" stroke="#64748B"/>
    <text x="330" y="285" font-size="13" font-weight="600" text-anchor="middle" fill="#334155">Team 2</text>
    <text x="330" y="305" font-size="10" text-anchor="middle" fill="#64748B">building</text>
    <rect x="470" y="250" width="120" height="78" rx="12" fill="#F1F5F9" stroke="#64748B"/>
    <text x="530" y="285" font-size="13" font-weight="600" text-anchor="middle" fill="#334155">Team 3</text>
    <text x="530" y="305" font-size="10" text-anchor="middle" fill="#64748B">building</text>
    <rect x="670" y="250" width="120" height="78" rx="12" fill="#F1F5F9" stroke="#64748B"/>
    <text x="730" y="285" font-size="13" font-weight="600" text-anchor="middle" fill="#334155">Team 4</text>
    <text x="730" y="305" font-size="10" text-anchor="middle" fill="#64748B">building</text>
  </g>

  <!-- Team tables row 2 -->
  <g>
    <rect x="70"  y="380" width="120" height="78" rx="12" fill="#F1F5F9" stroke="#64748B"/>
    <text x="130" y="415" font-size="13" font-weight="600" text-anchor="middle" fill="#334155">Team 5</text>
    <text x="130" y="435" font-size="10" text-anchor="middle" fill="#64748B">building</text>
    <rect x="270" y="380" width="120" height="78" rx="12" fill="#F1F5F9" stroke="#64748B"/>
    <text x="330" y="415" font-size="13" font-weight="600" text-anchor="middle" fill="#334155">Team 6</text>
    <text x="330" y="435" font-size="10" text-anchor="middle" fill="#64748B">building</text>
    <rect x="470" y="380" width="120" height="78" rx="12" fill="#F1F5F9" stroke="#64748B"/>
    <text x="530" y="415" font-size="13" font-weight="600" text-anchor="middle" fill="#334155">Team 7</text>
    <text x="530" y="435" font-size="10" text-anchor="middle" fill="#64748B">building</text>
    <rect x="670" y="380" width="120" height="78" rx="12" fill="#F1F5F9" stroke="#64748B"/>
    <text x="730" y="415" font-size="13" font-weight="600" text-anchor="middle" fill="#334155">Team 8</text>
    <text x="730" y="435" font-size="10" text-anchor="middle" fill="#64748B">building</text>
  </g>

  <!-- Liaison path: Team 6 -> Desk 2 -->
  <path d="M330,380 C350,300 410,240 440,168" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#arrow)"/>
  <text x="300" y="360" font-size="11" font-style="italic" fill="#475569">1 liaison:</text>
  <text x="300" y="374" font-size="11" font-style="italic" fill="#475569">ask in-role &#8594; walk back</text>

  <!-- Floaters -->
  <circle cx="210" cy="330" r="15" fill="#FDE68A" stroke="#D97706" stroke-width="2"/>
  <text x="210" y="335" font-size="12" font-weight="700" text-anchor="middle" fill="#7C2D12">F</text>

  <circle cx="620" cy="330" r="15" fill="#FDE68A" stroke="#D97706" stroke-width="2"/>
  <text x="620" y="335" font-size="12" font-weight="700" text-anchor="middle" fill="#7C2D12">F</text>
  <path d="M632,318 C680,270 700,210 712,170" fill="none" stroke="#D97706" stroke-width="1.6" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <text x="645" y="250" font-size="10" font-style="italic" fill="#B45309">overflow &#8594;</text>
  <text x="645" y="263" font-size="10" font-style="italic" fill="#B45309">opens 2nd lane</text>

  <circle cx="440" cy="470" r="15" fill="#FDE68A" stroke="#D97706" stroke-width="2"/>
  <text x="440" y="475" font-size="12" font-weight="700" text-anchor="middle" fill="#7C2D12">F</text>
  <text x="462" y="474" font-size="10" font-style="italic" fill="#B45309">curveballs + nudges</text>

  <!-- Legend -->
  <rect x="60" y="510" width="760" height="92" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
  <rect x="78" y="528" width="16" height="16" rx="3" fill="#DCEAFE" stroke="#2563EB"/>
  <text x="102" y="541" font-size="12" fill="#334155">Desk — info, in character (2 coaches each; voices that desk's roles)</text>
  <rect x="78" y="552" width="16" height="16" rx="3" fill="#F1F5F9" stroke="#64748B"/>
  <text x="102" y="565" font-size="12" fill="#334155">Team table — the team builds its Leadership Board here</text>
  <circle cx="86" cy="584" r="8" fill="#FDE68A" stroke="#D97706"/>
  <text x="102" y="588" font-size="12" fill="#334155">Floater &#215;3 — curveball dial, nudges forgotten desks, absorbs desk overflow</text>
  <text x="430" y="541" font-size="12" font-weight="600" fill="#0F172A">Why it stays fair + fast:</text>
  <text x="430" y="560" font-size="11.5" fill="#475569">One shared scenario (same 3 desks answer everyone) = comparable scores.</text>
  <text x="430" y="577" font-size="11.5" fill="#475569">Send ONE liaison, ~3 questions, walk back. Stagger which desk</text>
  <text x="430" y="593" font-size="11.5" fill="#475569">teams hit first + floater overflow = no real queue.</text>
</svg>
